<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>لوحة المتابعة</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap');

:root {
  --accent:       #2B5CE6;
  --accent-2:     #1a3a8f;
  --accent-light: #EEF2FF;
  --accent-hover: #2250d0;
  --bg:           #F2F5FC;
  --surface:      #ffffff;
  --border:       #DDE3F3;
  --border-2:     #EEF2FF;
  --text:         #1A1D2E;
  --text-2:       #6B7280;
  --text-3:       #9CA3AF;
  --danger:       #EF4444;
  --danger-light: #FEE2E2;
  --success:      #10B981;
  --success-light:#DCFCE7;
  --warn:         #F59E0B;
  --warn-light:   #FEF3C7;
  --purple:       #8B5CF6;
  --purple-light: #EDE9FE;
  --shadow-sm:    0 1px 3px rgba(43,92,230,0.07);
  --shadow-md:    0 4px 16px rgba(43,92,230,0.10);
  --radius-sm:    8px;
  --radius-md:    12px;
  --radius-lg:    16px;
  --cashier-grad: linear-gradient(145deg, #1a3a8f 0%, #2B5CE6 60%, #3b7af8 100%);
  --nav-h:        56px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Tajawal', 'Segoe UI', Tahoma, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  font-size: 14px;
}

/* ── Header ── */
.header {
  background: var(--cashier-grad);
  color: #fff;
  padding: 0 16px;
  height: 52px;
  display: flex; align-items: center; justify-content: space-between;
  box-shadow: 0 2px 10px rgba(26,35,126,0.3);
  position: sticky; top: 0; z-index: 200;
}
.header-brand { display: flex; align-items: center; gap: 9px; font-size: 15px; font-weight: 800; }
.header-brand .logo {
  width: 30px; height: 30px; border-radius: var(--radius-sm);
  background: rgba(255,255,255,.2); display: flex; align-items: center; justify-content: center;
  font-size: 16px;
}
.header-right { display: flex; align-items: center; gap: 8px; }

.conn-pill {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 10px; border-radius: 20px;
  font-size: 11px; font-weight: 700; transition: all .3s;
}
.conn-pill.connecting { background: rgba(245,158,11,.2);  color: #fde68a; border: 1px solid rgba(245,158,11,.35); }
.conn-pill.connected  { background: rgba(16,185,129,.2);  color: #6ee7b7; border: 1px solid rgba(16,185,129,.35); }
.conn-pill.error      { background: rgba(239,68,68,.2);   color: #fca5a5; border: 1px solid rgba(239,68,68,.35); }
.conn-dot { width: 7px; height: 7px; border-radius: 50%; }
.connecting .conn-dot { background: #fbbf24; animation: blink 1s infinite; }
.connected  .conn-dot { background: #34d399; }
.error      .conn-dot { background: #f87171; animation: blink 1s infinite; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.2} }

.btn-refresh {
  background: rgba(255,255,255,.15); border: 1px solid rgba(255,255,255,.3);
  color: #fff; border-radius: var(--radius-sm); padding: 6px 12px;
  font-size: 13px; font-weight: 700; cursor: pointer; font-family: inherit;
  transition: background .2s;
}
.btn-refresh:hover { background: rgba(255,255,255,.25); }
.btn-refresh:active { opacity: .7; transform: scale(.97); }
.btn-refresh.loading { opacity: .5; cursor: default; }

/* ── Bottom Navigation ── */
.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 200;
  height: var(--nav-h);
  background: var(--surface);
  border-top: 1px solid var(--border);
  display: flex;
  box-shadow: 0 -4px 20px rgba(43,92,230,0.08);
}
.nav-item {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 3px; cursor: pointer; transition: all .2s;
  font-size: 10px; font-weight: 700; color: var(--text-3);
  border: none; background: none; font-family: inherit;
  -webkit-tap-highlight-color: transparent;
}
.nav-item .nav-icon { font-size: 20px; transition: transform .2s; }
.nav-item.active { color: var(--accent); }
.nav-item.active .nav-icon { transform: translateY(-2px); }
.nav-item:active .nav-icon { transform: scale(.9); }

/* ── Pages ── */
.page { display: none; padding: 14px 14px calc(var(--nav-h) + 20px); max-width: 560px; margin: 0 auto; }
.page.active { display: block; }

/* ── Section title ── */
.section-title {
  font-size: 11px; font-weight: 800; color: var(--text-3);
  text-transform: uppercase; letter-spacing: .06em;
  margin: 18px 0 10px;
  display: flex; align-items: center; gap: 7px;
}
.section-title::after { content:''; flex:1; height:1.5px; background: var(--border); }
.section-title:first-child { margin-top: 4px; }

/* ── Stats grid ── */
.stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stat-card {
  background: var(--surface);
  border-radius: var(--radius-md);
  padding: 14px 16px;
  box-shadow: var(--shadow-sm);
  border: 1px solid var(--border);
  display: flex; align-items: center; gap: 12px;
  animation: fadeUp .35s ease both;
}
.stat-icon {
  width: 42px; height: 42px; border-radius: var(--radius-sm);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; font-size: 19px;
}
.stat-icon.blue   { background: var(--accent-light); }
.stat-icon.green  { background: var(--success-light); }
.stat-icon.yellow { background: var(--warn-light); }
.stat-icon.red    { background: var(--danger-light); }
.stat-icon.purple { background: var(--purple-light); }
.s-lbl { font-size: 11px; color: var(--text-3); margin-bottom: 3px; font-weight: 500; }
.s-val { font-size: 17px; font-weight: 800; }
.s-val.blue   { color: var(--accent); }
.s-val.green  { color: var(--success); }
.s-val.yellow { color: var(--warn); }
.s-val.red    { color: var(--danger); }
.s-val.purple { color: var(--purple); }
.s-sub { font-size: 11px; color: var(--text-3); margin-top: 2px; }

/* ── Card ── */
.card {
  background: var(--surface); border-radius: var(--radius-md);
  padding: 16px; box-shadow: var(--shadow-sm); border: 1px solid var(--border);
  animation: fadeUp .35s ease both;
}
.card-header {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 14px;
}
.card-header h3 { font-size: 14px; font-weight: 800; }

/* ── Badge ── */
.badge {
  display: inline-flex; align-items: center; gap: 4px;
  border-radius: 20px; padding: 3px 10px;
  font-size: 11px; font-weight: 700;
}
.badge-green  { background: var(--success-light); color: var(--success); }
.badge-orange { background: var(--warn-light);    color: var(--warn); }
.badge-blue   { background: var(--accent-light);  color: var(--accent); }
.badge-red    { background: var(--danger-light);  color: var(--danger); }
.badge-purple { background: var(--purple-light);  color: var(--purple); }

/* ── Progress ── */
.progress-item { margin-bottom: 12px; }
.progress-item:last-child { margin-bottom: 0; }
.progress-labels {
  display: flex; justify-content: space-between;
  font-size: 12px; font-weight: 600; margin-bottom: 5px; color: var(--text-2);
}
.progress-labels span:last-child { color: var(--text-3); font-weight: 500; }
.progress-bar { height: 7px; background: var(--bg); border-radius: 20px; overflow: hidden; }
.progress-fill { height: 100%; border-radius: 20px; transition: width .7s cubic-bezier(.4,0,.2,1); }
.fill-blue   { background: linear-gradient(90deg, var(--accent-2), var(--accent)); }
.fill-green  { background: linear-gradient(90deg, #059669, var(--success)); }
.fill-red    { background: linear-gradient(90deg, #b91c1c, var(--danger)); }
.fill-yellow { background: linear-gradient(90deg, #b45309, var(--warn)); }

/* ── Projected box ── */
.projected-box {
  background: var(--bg); border-radius: var(--radius-sm);
  padding: 10px 14px; margin-top: 12px;
  display: flex; justify-content: space-between; align-items: center;
  border: 1px solid var(--border);
}
.projected-box .lbl { font-size: 12px; color: var(--text-2); font-weight: 600; }
.projected-box .val { font-size: 15px; font-weight: 800; color: var(--warn); }

/* ── Stock rows ── */
.stock-row {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 12px; border-radius: var(--radius-sm);
  border: 1px solid var(--border-2); background: var(--bg);
  margin-bottom: 7px; animation: fadeUp .35s ease both;
  transition: box-shadow .15s;
}
.stock-row:last-child { margin-bottom: 0; }
.stock-row:hover { box-shadow: var(--shadow-sm); }
.stock-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
.stock-dot.critical { background: var(--danger); }
.stock-dot.warn     { background: var(--warn); }
.stock-dot.ok       { background: var(--success); }
.stock-info { flex: 1; min-width: 0; }
.stock-name { font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stock-min  { font-size: 11px; color: var(--text-3); margin-top: 1px; }
.stock-qty  { font-size: 18px; font-weight: 900; flex-shrink: 0; }
.stock-qty.critical { color: var(--danger); }
.stock-qty.warn     { color: var(--warn); }
.stock-qty.ok       { color: var(--success); }

/* ── Debt row ── */
.debt-row {
  display: flex; align-items: center; gap: 12px;
  padding: 11px 14px; border-radius: var(--radius-sm);
  border: 1px solid var(--border-2); background: var(--bg);
  margin-bottom: 7px; animation: fadeUp .35s ease both;
  cursor: pointer; transition: box-shadow .15s;
}
.debt-row:last-child { margin-bottom: 0; }
.debt-row:hover { box-shadow: var(--shadow-sm); background: #fff; }
.debt-avatar {
  width: 38px; height: 38px; border-radius: 50%;
  background: var(--accent-light); color: var(--accent);
  display: flex; align-items: center; justify-content: center;
  font-size: 15px; font-weight: 900; flex-shrink: 0;
}
.debt-info { flex: 1; min-width: 0; }
.debt-name { font-size: 13px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.debt-phone { font-size: 11px; color: var(--text-3); margin-top: 2px; }
.debt-amount { text-align: left; flex-shrink: 0; }
.debt-amount .amt { font-size: 15px; font-weight: 900; color: var(--danger); }
.debt-amount .lbl { font-size: 10px; color: var(--text-3); text-align: left; }

/* ── Cash history row ── */
.cash-row {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 12px; border-radius: var(--radius-sm);
  border: 1px solid var(--border-2); background: var(--bg);
  margin-bottom: 7px;
}
.cash-row:last-child { margin-bottom: 0; }
.cash-icon { font-size: 20px; flex-shrink: 0; }
.cash-info { flex: 1; min-width: 0; }
.cash-desc { font-size: 13px; font-weight: 700; }
.cash-date { font-size: 11px; color: var(--text-3); margin-top: 1px; }
.cash-val { font-size: 15px; font-weight: 900; flex-shrink: 0; }
.cash-val.in  { color: var(--success); }
.cash-val.out { color: var(--danger); }

/* ── Summary row ── */
.summary-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 9px 0; border-bottom: 1px solid var(--border-2);
  font-size: 13px;
}
.summary-row:last-child { border-bottom: none; padding-bottom: 0; }
.summary-row .s-key { color: var(--text-2); font-weight: 600; }
.summary-row .s-v   { font-weight: 800; }

/* ── Big number ── */
.big-number-box {
  background: linear-gradient(135deg, var(--accent-2), var(--accent));
  border-radius: var(--radius-lg); padding: 20px;
  color: #fff; text-align: center; margin-bottom: 14px;
}
.big-number-box .bn-label { font-size: 12px; opacity: .8; margin-bottom: 6px; font-weight: 600; }
.big-number-box .bn-value { font-size: 32px; font-weight: 900; letter-spacing: -1px; }
.big-number-box .bn-sub   { font-size: 12px; opacity: .7; margin-top: 4px; }

/* ── Empty / Error state ── */
.empty-state { text-align: center; padding: 24px 16px; color: var(--text-3); }
.empty-state .es-icon { font-size: 30px; margin-bottom: 7px; }
.empty-state p { font-size: 13px; font-weight: 600; }
.error-state {
  background: var(--surface); border-radius: var(--radius-md);
  padding: 30px 16px; text-align: center;
  border: 1px solid var(--border); box-shadow: var(--shadow-sm); margin-top: 20px;
}
.error-state .es-icon { font-size: 36px; margin-bottom: 10px; }
.error-state p { font-size: 14px; color: var(--text-2); font-weight: 600; margin-bottom: 4px; }
.error-state .es-hint { font-size: 12px; color: var(--text-3); }

/* ── Skeleton ── */
.skeleton {
  background: linear-gradient(90deg, var(--border) 25%, var(--border-2) 50%, var(--border) 75%);
  background-size: 200% 100%; animation: shimmer 1.3s infinite; border-radius: var(--radius-sm);
}
@keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
.skel-stat { height: 74px; border-radius: var(--radius-md); }
.skel-card { height: 130px; border-radius: var(--radius-md); }

/* ── Filter bar ── */
.filter-bar {
  display: flex; gap: 6px; margin-bottom: 14px; overflow-x: auto; padding-bottom: 2px;
  -ms-overflow-style: none; scrollbar-width: none;
}
.filter-bar::-webkit-scrollbar { display: none; }
.filter-btn {
  padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 700;
  border: 1.5px solid var(--border); background: var(--surface); color: var(--text-2);
  cursor: pointer; font-family: inherit; white-space: nowrap; transition: all .15s;
}
.filter-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

/* ── Last update ── */
.last-update { font-size: 11px; color: var(--text-3); text-align: center; padding: 10px 0 0; }

@keyframes fadeUp {
  from { opacity:0; transform:translateY(8px); }
  to   { opacity:1; transform:translateY(0); }
}
</style>
</head>
<body>

<div class="header">
  <div class="header-brand">
    <div class="logo">📊</div>
    لوحة المتابعة
  </div>
  <div class="header-right">
    <div class="conn-pill connecting" id="connPill">
      <div class="conn-dot"></div>
      <span id="connTxt">جاري الاتصال...</span>
    </div>
    <button class="btn-refresh" id="btnBackup" onclick="downloadBackup()" title="تنزيل نسخة احتياطية">⬇</button>
    <button class="btn-refresh" id="btnRefresh" onclick="loadAll()">↻</button>
  </div>
</div>

<!-- ──��� Page: الرئيسية ─── -->
<div class="page active" id="page-home">
  <div class="section-title">📦 ملخص اليوم</div>
  <div class="stats-grid" id="home-today">
    <div class="skeleton skel-stat"></div><div class="skeleton skel-stat"></div>
    <div class="skeleton skel-stat"></div><div class="skeleton skel-stat"></div>
  </div>
  <div class="section-title">📈 الشهر</div>
  <div id="home-month"><div class="skeleton skel-card"></div></div>
  <div class="section-title">⚠️ مخزون منخفض</div>
  <div id="home-lowstock"><div class="skeleton skel-card"></div></div>
</div>

<!-- ─── Page: المخزون ─── -->
<div class="page" id="page-inventory">
  <div class="section-title">📦 إجمالي المخزون</div>
  <div class="stats-grid" id="inv-stats">
    <div class="skeleton skel-stat"></div><div class="skeleton skel-stat"></div>
    <div class="skeleton skel-stat"></div><div class="skeleton skel-stat"></div>
  </div>
  <div class="section-title">🔴 منتجات بحاجة تزويد</div>
  <div class="filter-bar">
    <button class="filter-btn active" onclick="filterInventory('all',this)">الكل</button>
    <button class="filter-btn" onclick="filterInventory('critical',this)">نفد 🔴</button>
    <button class="filter-btn" onclick="filterInventory('warn',this)">منخفض 🟡</button>
    <button class="filter-btn" onclick="filterInventory('ok',this)">جيد ✅</button>
  </div>
  <div id="inv-list"><div class="skeleton skel-card"></div></div>
</div>

<!-- ─── Page: الخزنة ─── -->
<div class="page" id="page-cash">
  <div id="cash-balance"></div>
  <div class="section-title">💳 ملخص الخزنة</div>
  <div class="stats-grid" id="cash-stats">
    <div class="skeleton skel-stat"></div><div class="skeleton skel-stat"></div>
    <div class="skeleton skel-stat"></div><div class="skeleton skel-stat"></div>
  </div>
  <div class="section-title">📋 آخر الحركات</div>
  <div id="cash-history"><div class="skeleton skel-card"></div></div>
</div>

<!-- ─── Page: التقارير ─── -->
<div class="page" id="page-reports">
  <div class="section-title">📅 الفترة الزمنية</div>
  <div class="filter-bar">
    <button class="filter-btn active" onclick="filterReports('today',this)">اليوم</button>
    <button class="filter-btn" onclick="filterReports('week',this)">الأسبوع</button>
    <button class="filter-btn" onclick="filterReports('month',this)">الشهر</button>
    <button class="filter-btn" onclick="filterReports('all',this)">الكل</button>
  </div>
  <div id="reports-content"><div class="skeleton skel-card" style="height:200px"></div></div>
</div>

<!-- ─── Page: ديون الزبائن ─── -->
<div class="page" id="page-debts">
  <div class="section-title">💰 إجمالي الديون</div>
  <div id="debts-total"><div class="skeleton skel-stat" style="height:90px;border-radius:12px"></div></div>
  <div class="section-title">👤 قائمة المديونين</div>
  <div class="filter-bar">
    <button class="filter-btn active" onclick="filterDebts('all',this)">الكل</button>
    <button class="filter-btn" onclick="filterDebts('high',this)">أكبر دين</button>
    <button class="filter-btn" onclick="filterDebts('recent',this)">الأحدث</button>
  </div>
  <div id="debts-list"><div class="skeleton skel-card"></div></div>
</div>

<!-- ─── Bottom Navigation ─── -->
<nav class="bottom-nav">
  <button class="nav-item active" onclick="goPage('home',this)">
    <span class="nav-icon">🏠</span>الرئيسية
  </button>
  <button class="nav-item" onclick="goPage('inventory',this)">
    <span class="nav-icon">📦</span>المخزون
  </button>
  <button class="nav-item" onclick="goPage('cash',this)">
    <span class="nav-icon">🏦</span>الخزنة
  </button>
  <button class="nav-item" onclick="goPage('reports',this)">
    <span class="nav-icon">📈</span>التقارير
  </button>
  <button class="nav-item" onclick="goPage('debts',this)">
    <span class="nav-icon">💳</span>الديون
  </button>
</nav>

<script>
(() => {
  const roomId = location.pathname.split('/').pop();
  // توكن الوصول السري — يأتي في الـ hash (#t=...) حتى لا يظهر في سجلات السيرفر
  const dashToken = new URLSearchParams(location.hash.slice(1)).get('t') || '';
  if (!dashToken) {
    document.body.innerHTML = '<div style="max-width:420px;margin:80px auto;text-align:center;font-family:Tajawal,sans-serif;padding:24px">'
      + '<div style="font-size:48px">🔒</div>'
      + '<h2 style="margin:12px 0 6px">رابط غير مكتمل</h2>'
      + '<p style="color:#6B7280;font-size:14px">هذا الرابط ينقصه توكن الوصول السري. افتح لوحة المتابعة من داخل التطبيق (زر سكانر الهاتف) للحصول على الرابط الصحيح.</p>'
      + '</div>';
    throw new Error('missing dashboard token');
  }
  let _data = null; // cached full data
  let _reportPeriod = 'today';
  let _invFilter = 'all';
  let _debtFilter = 'all';

  // ── utilities ────────────────────────────────────────────────────────────
  const cur = () => (_data?.currency) || 'DA';
  function fmt(n) {
    return Number(n || 0).toLocaleString('ar-DZ', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
  }
  function nowTime() {
    const t = new Date();
    return [t.getHours(), t.getMinutes(), t.getSeconds()].map(n => String(n).padStart(2,'0')).join(':');
  }
  function esc(s) {
    return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
  function today() {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }
  function thisMonth() { return today().slice(0,7); }
  // بداية الأسبوع = السبت (نفس منطق التطبيق: reports.js -> (getDay()+1)%7)
  function startOfWeek() {
    const d = new Date(); d.setDate(d.getDate() - ((d.getDay() + 1) % 7)); d.setHours(0,0,0,0); return d;
  }
  // يحوّل تاريخ ISO (UTC) إلى تاريخ محلي "YYYY-MM-DD" بدل مقارنة السلسلة الخام —
  // يمنع تصنيف فواتير قريبة من منتصف الليل ليوم خاطئ
  function localDateStr(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    if (isNaN(d.getTime())) return String(iso).slice(0, 10);
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  // فلترة أي قائمة (مبيعات/مشتريات) حسب الفترة، بنفس تعريف الفترات المستعملة في التطبيق
  function filterByPeriod(list, period, dateField) {
    dateField = dateField || 'date';
    const t = today(), m = thisMonth(), sw = startOfWeek();
    return (list || []).filter(x => {
      const raw = x[dateField];
      if (!raw) return false;
      if (period === 'today') return localDateStr(raw) === t;
      if (period === 'week')  return new Date(raw) >= sw;
      if (period === 'month') return localDateStr(raw).slice(0, 7) === m;
      return true; // all
    });
  }
  // خريطة اسم المنتج -> سعر التكلفة (لحساب الربح)
  function _productCostMap() {
    const map = {};
    (_data?.products || []).forEach(p => { map[p.name] = p.costPrice || 0; });
    return map;
  }
  // نفس منطق saleProfit في reports.js بالتطبيق تماماً — الآن returnedCost
  // الحقيقي مُرسَل من التطبيق (حقل sale.returnedCost) فلا حاجة لأي تقدير.
  function saleProfitJs(sale, costMap) {
    if (sale.isInitialDebt) return null;
    let totalCost = 0, manualOnlyTotal = 0, hasAllCosts = true;
    (sale.items || []).forEach(item => {
      if (item.isManual && !item.isManualProduct) return;
      if (item.lineCost && item.lineCost > 0) {
        totalCost += item.lineCost;
      } else if (item.isManualProduct) {
        const lineVal = item.lineTotal !== undefined ? item.lineTotal : (item.price || 0) * (item.qty || 1);
        manualOnlyTotal += lineVal;
      } else if (!item.isManual) {
        const cp = costMap[item.name];
        if (cp && cp > 0) { totalCost += cp * (item.qty || 1); } else { hasAllCosts = false; }
      }
    });
    if (!hasAllCosts && totalCost === 0) return null;
    const saleBase = (sale.total || 0) - manualOnlyTotal;
    const netCost = Math.max(0, totalCost - (sale.returnedCost || 0));
    return saleBase - netCost;
  }
  // خسائر المخزون والمصاريف للفترة — نفس فلترة reports.js بالتطبيق (via filterByPeriod)
  function _periodLossValue(period) {
    return filterByPeriod(_data?.stockLosses, period)
      .reduce((s, l) => s + (l.totalLoss || 0), 0);
  }
  function _periodExpensesValue(period) {
    return filterByPeriod(_data?.expenses, period)
      .reduce((s, e) => s + (e.amount || 0), 0);
  }
  // إحصائيات فترة موحّدة (تُستعمل في الرئيسية والتقارير معاً) — مصدر واحد للحقيقة
  function computeStats(period) {
    const costMap = _productCostMap();
    // كل فواتير الفترة (شاملة الديون المبدئية) — تُستعمل فقط لحساب الدين، مطابقةً للتطبيق
    const periodAll = filterByPeriod(_data?.sales, period);
    // فواتير المبيعات الحقيقية فقط (بدون الديون المبدئية) — للمبيعات/الربح/المرتجعات
    const filtered = periodAll.filter(s => !s.isInitialDebt);
    const revenue = filtered.reduce((s, x) => s + (x.total || 0), 0);
    const paid    = filtered.reduce((s, x) => s + (x.paid || 0), 0);
    const returns = filtered.reduce((s, x) => s + (x.returnedTotal || 0), 0);
    const grossProfit  = filtered.reduce((s, x) => s + (saleProfitJs(x, costMap) || 0), 0);
    // خسائر المخزون والمصاريف للفترة — نفس منطق netProfitAfterExp بالتطبيق
    const lossValue     = _periodLossValue(period);
    const expensesValue = _periodExpensesValue(period);
    const profit = grossProfit - lossValue - expensesValue; // صافٍ، مطابق "Bénéfice net" بالتطبيق
    // الدين: لفترة "الكل" نستعمل رصيد الزبائن التراكمي الفعلي (نفس صفحة الديون)،
    // ولباقي الفترات نحسب دين كل فواتير الفترة شاملة الديون المبدئية (نفس منطق التطبيق تماماً)
    const debt = period === 'all'
      ? (_data?.customers || []).reduce((s, c) => s + Math.max(0, c.debt || 0), 0)
      : periodAll.reduce((s, x) => s + Math.max(0, (x.total || 0) - (x.paid || 0)), 0);
    return { filtered, revenue, paid, returns, profit, grossProfit, lossValue, expensesValue, debt, count: filtered.length };
  }

  // ── navigation ───────────────────────────────────────────────────────────
  window.goPage = (name, btn) => {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
    document.getElementById('page-' + name).classList.add('active');
    btn.classList.add('active');
    // render that page if data ready
    if (_data) renderPage(name);
  };

  // ── connection pill ───────────────────────────────────────────────────────
  function setConn(state, txt) {
    const el = document.getElementById('connPill');
    el.className = 'conn-pill ' + state;
    el.innerHTML = `<div class="conn-dot"></div><span>${txt}</span>`;
  }

  // ── load all data ─────────────────────────────────────────────────────────
  // ── retry state ──────────────────────────────────────────────────────────
  let _retryCount = 0;
  let _retryTimer = null;
  const RETRY_DELAYS = [5, 10, 20, 30]; // ثواني

  function scheduleRetry() {
    if (_retryTimer) return;
    const delay = (RETRY_DELAYS[Math.min(_retryCount, RETRY_DELAYS.length-1)]) * 1000;
    _retryCount++;
    setConn('connecting', `⏳ إعادة المحاولة خلال ${delay/1000}ث...`);
    _retryTimer = setTimeout(() => { _retryTimer = null; loadAll(true); }, delay);
  }

  // ── تنزيل نسخة احتياطية كاملة (نفس دقة "تصدير نسخة احتياطية" داخل البرنامج نفسه) ──
  // بخلاف بطاقات اللوحة (بيانات مبسّطة/lite للعرض السريع)، هذا الزر يستعمل جسر
  // /api/relay الموجود أصلاً (يمرّر طلب REST لنقطة البيع عبر الغرفة) ليطلب
  // /api/data مباشرة — وهي نفس نقطة النهاية التي يعتمدها البرنامج محلياً في وضع
  // "عميل/سيرفر"، وتحتوي كل الجداول: منتجات، عملاء، موردين، مبيعات ومشتريات
  // كاملة، مرتجعات (بالباركود أيضاً)، طلبيات، حجوزات، سجل المخزون، الفئات،
  // الباقات، المستخدمين، الإعدادات الكاملة (بلا حاجة لأي تحديث فـ البرنامج نفسه)
  window.downloadBackup = async () => {
    const btn = document.getElementById('btnBackup');
    if (btn.classList.contains('loading')) return; // طلب شغّال بالفعل
    btn.classList.add('loading'); btn.disabled = true;
    try {
      const res = await fetch(`/api/relay/${roomId}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Dash-Token': dashToken },
        body: JSON.stringify({ method: 'GET', path: '/api/data' }),
        signal: AbortSignal.timeout(130000)
      });
      const text = await res.text();
      let data;
      try { data = JSON.parse(text); } catch (e) { data = null; }
      if (!res.ok) {
        alert((data && data.error) || `تعذّر جلب النسخة الاحتياطية (HTTP ${res.status})`);
        return;
      }
      if (!data) { alert('لم يتم استلام بيانات صالحة'); return; }
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url  = URL.createObjectURL(blob);
      const ts   = new Date().toISOString().slice(0,19).replace(/[:T]/g,'-');
      const a    = document.createElement('a');
      a.href = url;
      a.download = `vendix-backup-${roomId.slice(0,8)}-${ts}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    } catch (e) {
      alert('تعذّر تنزيل النسخة الاحتياطية — تأكد من اتصال البرنامج ثم أعد المحاولة');
    } finally {
      btn.classList.remove('loading'); btn.disabled = false;
    }
  };

  window.loadAll = async (isRetry) => {
    if (!isRetry) { _retryCount = 0; if (_retryTimer) { clearTimeout(_retryTimer); _retryTimer = null; } }
    const btn = document.getElementById('btnRefresh');
    btn.classList.add('loading'); btn.disabled = true;
    setConn('connecting', 'جاري التحديث...');
    try {
      const res = await fetch(`/api/dashboard-full/${roomId}?token=${encodeURIComponent(dashToken)}`, { signal: AbortSignal.timeout(50000) });

      // 503 = POS مقطوع أو الـ server استيقظ للتو
      if (res.status === 503) {
        const errData = await res.json().catch(() => ({}));
        const is503 = true;
        const retryIn = RETRY_DELAYS[Math.min(_retryCount, RETRY_DELAYS.length-1)];
        setConn('error', `📡 POS غير متصل — إعادة ${_retryCount+1}`);
        // إذا عندنا بيانات سابقة، لا تمسح الشاشة
        if (!_data) renderErrorSoft('البرنامج غير متصل بالإنترنت حالياً', `ستتم إعادة المحاولة خلال ${retryIn} ثانية...`);
        scheduleRetry();
        return;
      }

      if (!res.ok) throw new Error('HTTP ' + res.status);
      const d = await res.json();
      if (d.error) throw new Error(d.error);
      _data = d;
      _retryCount = 0;
      renderAll();
      setConn('connected', '✅ ' + nowTime());
    } catch(e) {
      if (e.name === 'AbortError' || e.name === 'TimeoutError') {
        setConn('error', '⏱ انتهى وقت الاتصال');
        if (!_data) renderErrorSoft('انتهى وقت الاتصال', 'الـ POS لا يستجيب — ستتم إعادة المحاولة تلقائياً');
        scheduleRetry();
      } else if (e.message?.includes('Failed to fetch') || e.message?.includes('NetworkError')) {
        setConn('error', '🌐 لا يوجد إنترنت');
        if (!_data) renderErrorSoft('لا يوجد اتصال بالإنترنت', 'ستتم إعادة المحاولة تلقائياً');
        scheduleRetry();
      } else {
        setConn('error', '❌ ' + (e.message || 'خطأ'));
        if (!_data) renderErrorSoft(e.message || 'خطأ', '');
        scheduleRetry();
      }
    } finally {
      btn.classList.remove('loading'); btn.disabled = false;
    }
  };

  // رسالة خطأ ناعمة — لا تمسح البيانات الموجودة على الشاشة
  function renderErrorSoft(title, hint) {
    const activePage = document.querySelector('.page.active')?.id?.replace('page-','') || 'home';
    // فقط إذا الصفحة فارغة (لم تُحمَّل بيانات بعد)
    const firstCard = document.querySelector('.page.active .stat-card, .page.active .card');
    if (firstCard) return; // البيانات موجودة، لا تمسح
    ['home-today','inv-stats','cash-balance','reports-content','debts-total'].forEach(id => {
      const el = document.getElementById(id);
      if (el && el.querySelector('.skeleton')) {
        el.innerHTML = `<div class="error-state">
          <div class="es-icon">📡</div>
          <p>${esc(title)}</p>
          <p class="es-hint">${esc(hint)}</p>
        </div>`;
      }
    });
  }

  function renderError(msg) {
    ['home-today','home-month','home-lowstock','inv-stats','inv-list','cash-balance',
     'cash-stats','cash-history','reports-content','debts-total','debts-list'].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.innerHTML = `<div class="error-state"><div class="es-icon">📡</div>
        <p>${esc(msg)}</p><p class="es-hint">تأكد أن البرنامج يعمل</p></div>`;
    });
  }

  // ── render all pages ──────────────────────────────────────────────────────
  function renderAll() {
    const activePage = document.querySelector('.page.active')?.id?.replace('page-','') || 'home';
    renderHome();
    if (activePage !== 'home') renderPage(activePage);
  }

  function renderPage(name) {
    if (!_data) return;
    if (name === 'home')      renderHome();
    if (name === 'inventory') renderInventory();
    if (name === 'cash')      renderCash();
    if (name === 'reports')   renderReports();
    if (name === 'debts')     renderDebts();
  }

  // ── stat card helper ──────────────────────────────────────────────────────
  function statCard(icon, color, lbl, val, sub) {
    return `<div class="stat-card">
      <div class="stat-icon ${color}">${icon}</div>
      <div class="stat-info">
        <div class="s-lbl">${lbl}</div>
        <div class="s-val ${color}">${val}</div>
        ${sub ? `<div class="s-sub">${sub}</div>` : ''}
      </div>
    </div>`;
  }

  // ══════════════════════════════════════════════════════════════════════════
  // PAGE: الرئيسية
  // ══════════════════════════════════════════════════════════════════════════
  function renderHome() {
    const d = _data;
    const C = cur();
    const statsD = computeStats('today');
    const statsM = computeStats('month');
    const revD = statsD.revenue;
    const proD = statsD.profit;
    const revM = statsM.revenue;
    const proM = statsM.profit;
    const sales = statsD.count;
    const marginD = revD > 0 ? ((proD/revD)*100).toFixed(1) : '0.0';
    const marginM = revM > 0 ? ((proM/revM)*100).toFixed(1) : '0.0';
    const dayNum  = new Date().getDate();
    const daysInM = new Date(new Date().getFullYear(), new Date().getMonth()+1, 0).getDate();
    const monthPct = Math.round((dayNum/daysInM)*100);
    const projected = dayNum > 0 ? Math.round((proM/dayNum)*daysInM) : 0;
    const low = d.low_stock || [];

    // today stats
    let todayHtml = statCard('💰','blue','إيرادات اليوم',`${fmt(revD)} ${C}`,'') +
      statCard('🧾','green','عدد الفواتير',`${sales}`,sales > 0 ? 'فاتورة' : '') +
      statCard('📈', proD >= 0 ? 'yellow':'red','ربح اليوم',`${fmt(proD)} ${C}`,`هامش ${marginD}%`) +
      statCard('🏪', proM >= 0 ? 'green':'red','ربح الشهر',`${fmt(proM)} ${C}`,`هامش ${marginM}%`);
    document.getElementById('home-today').innerHTML = todayHtml;

    // month card
    let mHtml = `<div class="card">
      <div class="card-header"><h3>تقدم الشهر</h3><span class="badge badge-blue">${dayNum}/${daysInM} يوم</span></div>
      <div class="progress-item">
        <div class="progress-labels"><span>الأيام المنقضية</span><span>${monthPct}%</span></div>
        <div class="progress-bar"><div class="progress-fill fill-blue" style="width:${monthPct}%"></div></div>
      </div>
      <div class="progress-item">
        <div class="progress-labels"><span>إيرادات الشهر</span><span>${fmt(revM)} ${C}</span></div>
        <div class="progress-bar"><div class="progress-fill fill-green" style="width:100%"></div></div>
      </div>
      <div class="projected-box">
        <span class="lbl">📊 الربح المتوقع لنهاية الشهر</span>
        <span class="val">${fmt(projected)} ${C}</span>
      </div>
    </div>`;
    document.getElementById('home-month').innerHTML = mHtml;

    // low stock
    let lsHtml;
    if (low.length === 0) {
      lsHtml = `<div class="card"><div class="empty-state"><div class="es-icon">✅</div><p>كل المنتجات بمخزون جيد</p></div></div>`;
    } else {
      lsHtml = `<div class="card"><div class="card-header"><h3>منتجات تحتاج تزويد</h3><span class="badge badge-orange">${low.length} منتج</span></div>`;
      for (const p of low.slice(0,5)) {
        const cls = p.quantity <= 0 ? 'critical' : 'warn';
        lsHtml += `<div class="stock-row">
          <div class="stock-dot ${cls}"></div>
          <div class="stock-info"><div class="stock-name">${esc(p.name)}</div><div class="stock-min">الحد الأدنى: ${p.min_stock||5}</div></div>
          <div class="stock-qty ${cls}">${p.quantity}</div>
        </div>`;
      }
      if (low.length > 5) lsHtml += `<p style="font-size:12px;color:var(--text-3);text-align:center;margin-top:8px">و ${low.length-5} منتج آخر...</p>`;
      lsHtml += `</div>`;
    }
    document.getElementById('home-lowstock').innerHTML = lsHtml;
  }

  // ══════════════════════════════════════════════════════════════════════════
  // PAGE: المخزون
  // ══════════════════════════════════════════════════════════════════════════
  window.filterInventory = (f, btn) => {
    _invFilter = f;
    document.querySelectorAll('#page-inventory .filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderInventoryList();
  };

  function renderInventory() {
    const products = _data.products || [];
    const C = cur();
    const total = products.length;
    const criticalCount = products.filter(p => (p.stock||0) <= 0).length;
    const warnCount = products.filter(p => (p.stock||0) > 0 && (p.stock||0) <= (p.minStock||5)).length;
    const totalValue = products.reduce((s,p) => {
      const stock = p.stock||0, cost = p.costPrice||0;
      // نفس شرط التطبيق بالضبط (computeInventoryValueAndProfit): نتجاهل
      // المخزون السالب/الصفري وتكلفة الشراء الفارغة حتى تطابق القيمة المعروضة
      // في التطبيق تماماً بدل ما يُطرح المخزون السالب من المجموع.
      return (stock > 0 && cost > 0) ? s + stock*cost : s;
    }, 0);
    const okCount = total - criticalCount - warnCount;

    document.getElementById('inv-stats').innerHTML =
      statCard('📦','blue','إجمالي المنتجات',`${total}`,`${okCount} بمخزون جيد`) +
      statCard('💰','green','قيمة المخزون',`${fmt(totalValue)} ${C}`,'بسعر الشراء') +
      statCard('🟡','yellow','منخفض المخزون',`${warnCount}`,warnCount > 0 ? 'يحتاج تزويد':'') +
      statCard('🔴','red','نفد المخزون',`${criticalCount}`,criticalCount > 0 ? 'عاجل':'');

    renderInventoryList();
  }

  function renderInventoryList() {
    const products = _data.products || [];
    let filtered = products;
    if (_invFilter === 'critical') filtered = products.filter(p => (p.stock||0) <= 0);
    else if (_invFilter === 'warn') filtered = products.filter(p => (p.stock||0) > 0 && (p.stock||0) <= (p.minStock||5));
    else if (_invFilter === 'ok')   filtered = products.filter(p => (p.stock||0) > (p.minStock||5));

    // sort: critical first, then warn, then ok
    filtered = [...filtered].sort((a,b) => {
      const lvl = p => (p.stock||0) <= 0 ? 0 : (p.stock||0) <= (p.minStock||5) ? 1 : 2;
      return lvl(a) - lvl(b);
    });

    if (filtered.length === 0) {
      document.getElementById('inv-list').innerHTML = `<div class="card"><div class="empty-state"><div class="es-icon">✅</div><p>لا توجد منتجات في هذه الفئة</p></div></div>`;
      return;
    }

    let html = `<div class="card"><div class="card-header"><h3>المنتجات (${filtered.length})</h3></div>`;
    for (const p of filtered) {
      const qty = p.stock || 0;
      const min = p.minStock || 5;
      const cls = qty <= 0 ? 'critical' : qty <= min ? 'warn' : 'ok';
      html += `<div class="stock-row">
        <div class="stock-dot ${cls}"></div>
        <div class="stock-info">
          <div class="stock-name">${esc(p.name)}</div>
          <div class="stock-min">الحد الأدنى: ${min} — باركود: ${p.barcode ? esc(p.barcode) : '—'}</div>
        </div>
        <div class="stock-qty ${cls}">${qty}</div>
      </div>`;
    }
    html += `</div>`;
    document.getElementById('inv-list').innerHTML = html;
  }

  // ══════════════════════════════════════════════════════════════════════════
  // PAGE: الخزنة
  // ══════════════════════════════════════════════════════════════════════════
  function renderCash() {
    const d = _data;
    const C = cur();
    const cashDrawer = parseFloat(d.cash_drawer || 0);
    const sales = d.sales || [];
    const purchases = d.purchases || [];

    // revenue collected (paid amounts from sales today)
    const tdSales = filterByPeriod(sales, 'today');
    const tdRevenue = tdSales.reduce((s,x) => s + (x.paid||0), 0);
    const tdPurchases = filterByPeriod(purchases, 'today')
                                 .reduce((s,p) => s + (p.paid||0), 0);
    const totalDebt = (d.customers||[]).reduce((s,c) => s + Math.max(0, c.debt||0), 0);

    // cash history (newest-first, matching desktop's storage order)
    let cashHistory = [];
    try { cashHistory = JSON.parse(d.cash_history || '[]'); } catch(e) {}

    // صافي اليوم = صافي التغير في الخزنة اليوم (من سجل حركات الخزنة الفعلي)
    const todayEntries = cashHistory.filter(h => localDateStr(h.datetime || h.date) === today());
    const netToday = todayEntries.reduce((s,h) => {
      const amt = h.amount || 0;
      const isOut = (h.type === 'purchase' || h.type === 'withdraw' || h.type === 'refund');
      return s + (isOut ? -amt : amt);
    }, 0);

    // big balance box
    document.getElementById('cash-balance').innerHTML = `
      <div class="big-number-box">
        <div class="bn-label">💰 رصيد الخزنة الحالي</div>
        <div class="bn-value">${fmt(cashDrawer)} ${C}</div>
        <div class="bn-sub">آخر تحديث: ${nowTime()}</div>
      </div>`;

    document.getElementById('cash-stats').innerHTML =
      statCard('📥','green','مقبوضات اليوم',`${fmt(tdRevenue)} ${C}`,'من المبيعات') +
      statCard('📤','red','مدفوعات اليوم',`${fmt(tdPurchases)} ${C}`,'مشتريات') +
      statCard('💳','yellow','إجمالي الديون',`${fmt(totalDebt)} ${C}`,'من الزبائن') +
      statCard('📊','blue','صافي اليوم',`${fmt(netToday)} ${C}`,'صافي التغير في الخزنة');

    const typeLabel = {
      deposit:  'إيداع',
      withdraw: 'سحب',
      sale:     'بيع',
      purchase: 'شراء',
      refund:   'مرتجع',
    };

    let hHtml = `<div class="card"><div class="card-header"><h3>آخر الحركات</h3><span class="badge badge-blue">${cashHistory.length}</span></div>`;
    if (cashHistory.length === 0) {
      hHtml += `<div class="empty-state"><div class="es-icon">📋</div><p>لا توجد حركات مسجلة</p></div>`;
    } else {
      // cashHistory مخزن مع الأحدث أولاً (unshift)، فلا حاجة لعكسه
      const recent = cashHistory.slice(0, 20);
      for (const h of recent) {
        const isOut = (h.type === 'purchase' || h.type === 'withdraw' || h.type === 'refund');
        const isIn = !isOut;
        const dt = h.datetime ? new Date(h.datetime) : null;
        const dateStr = dt ? dt.toLocaleString('ar-DZ', {day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}) : '';
        hHtml += `<div class="cash-row">
          <div class="cash-icon">${isIn ? '📥' : '📤'}</div>
          <div class="cash-info">
            <div class="cash-desc">${esc(h.reason || typeLabel[h.type] || (isIn ? 'إيداع' : 'سحب'))}</div>
            <div class="cash-date">${esc(dateStr)}</div>
          </div>
          <div class="cash-val ${isIn?'in':'out'}">${isIn?'+':'-'}${fmt(h.amount)} ${C}</div>
        </div>`;
      }
    }
    hHtml += `</div>`;
    document.getElementById('cash-history').innerHTML = hHtml;
  }

  // ══════════════════════════════════════════════════════════════════════════
  // PAGE: التقارير
  // ══════════════════════════════════════════════════════════════════════════
  window.filterReports = (period, btn) => {
    _reportPeriod = period;
    document.querySelectorAll('#page-reports .filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    if (_data) renderReports();
  };

  function renderReports() {
    const d = _data;
    const C = cur();
    const allPurchases = d.purchases || [];
    const stats = computeStats(_reportPeriod);
    const { filtered, revenue, paid, debt, returns, profit, count } = stats;

    // top products
    const productSales = {};
    filtered.forEach(s => {
      (s.items||[]).forEach(item => {
        if (!item.name) return;
        if (!productSales[item.name]) productSales[item.name] = { qty:0, rev:0 };
        productSales[item.name].qty += item.qty || 0;
        productSales[item.name].rev += item.lineTotal || (item.price*item.qty) || 0;
      });
    });
    const topProducts = Object.entries(productSales)
      .sort((a,b) => b[1].rev - a[1].rev).slice(0, 5);

    // filter purchases too (بنفس تعريف الفترات الموحّد)
    const filtPurch = filterByPeriod(allPurchases, _reportPeriod);
    const purchTotal = filtPurch.reduce((s,p) => s + (p.total||0), 0);

    const periodLabel = { today:'اليوم', week:'هذا الأسبوع', month:'هذا الشهر', all:'كل الوقت' }[_reportPeriod];

    let html = `
      <div class="card" style="margin-bottom:12px">
        <div class="card-header"><h3>ملخص ${periodLabel}</h3><span class="badge badge-blue">${count} فاتورة</span></div>
        <div class="summary-row"><span class="s-key">إجمالي المبيعات</span><span class="s-v" style="color:var(--success)">${fmt(revenue)} ${C}</span></div>
        <div class="summary-row"><span class="s-key">الربح</span><span class="s-v" style="color:#1565c0">${fmt(profit)} ${C}</span></div>
        <div class="summary-row"><span class="s-key">المبالغ المقبوضة</span><span class="s-v" style="color:var(--accent)">${fmt(paid)} ${C}</span></div>
        <div class="summary-row"><span class="s-key">الديون المتراكمة</span><span class="s-v" style="color:var(--danger)">${fmt(debt)} ${C}</span></div>
        <div class="summary-row"><span class="s-key">المرتجعات</span><span class="s-v" style="color:var(--warn)">${fmt(returns)} ${C}</span></div>
        <div class="summary-row"><span class="s-key">المشتريات</span><span class="s-v" style="color:var(--text-2)">${fmt(purchTotal)} ${C}</span></div>
      </div>`;

    if (topProducts.length > 0) {
      const maxRev = topProducts[0][1].rev;
      html += `<div class="card">
        <div class="card-header"><h3>أكثر المنتجات مبيعاً</h3></div>`;
      topProducts.forEach(([name, info], i) => {
        const pct = maxRev > 0 ? Math.round((info.rev/maxRev)*100) : 0;
        html += `<div class="progress-item">
          <div class="progress-labels">
            <span>${i+1}. ${esc(name)}</span>
            <span>${fmt(info.rev)} ${C} (×${fmt(info.qty)})</span>
          </div>
          <div class="progress-bar"><div class="progress-fill fill-blue" style="width:${pct}%"></div></div>
        </div>`;
      });
      html += `</div>`;
    } else {
      html += `<div class="card"><div class="empty-state"><div class="es-icon">📊</div><p>لا توجد مبيعات في هذه الفترة</p></div></div>`;
    }

    document.getElementById('reports-content').innerHTML = html;
  }

  // ══════════════════════════════════════════════════════════════════════════
  // PAGE: ديون الزبائن
  // ══════════════════════════════════════════════════════════════════════════
  window.filterDebts = (f, btn) => {
    _debtFilter = f;
    document.querySelectorAll('#page-debts .filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    if (_data) renderDebts();
  };

  function renderDebts() {
    const customers = (_data.customers || []).filter(c => (c.debt||0) > 0);
    const C = cur();
    const totalDebt = customers.reduce((s,c) => s + (c.debt||0), 0);

    document.getElementById('debts-total').innerHTML = `
      <div class="big-number-box" style="background:linear-gradient(135deg,#b91c1c,var(--danger))">
        <div class="bn-label">💳 إجمالي الديون</div>
        <div class="bn-value">${fmt(totalDebt)} ${C}</div>
        <div class="bn-sub">${customers.length} زبون مدين</div>
      </div>`;

    let sorted = [...customers];
    if (_debtFilter === 'high')   sorted.sort((a,b) => (b.debt||0) - (a.debt||0));
    else if (_debtFilter === 'recent') sorted.sort((a,b) => {
      const da = a.lastPayment || '';
      const db = b.lastPayment || '';
      return da < db ? 1 : da > db ? -1 : 0;
    });

    if (sorted.length === 0) {
      document.getElementById('debts-list').innerHTML = `<div class="card"><div class="empty-state"><div class="es-icon">🎉</div><p>لا توجد ديون مستحقة</p></div></div>`;
      return;
    }

    let html = `<div class="card"><div class="card-header"><h3>المديونون (${sorted.length})</h3></div>`;
    for (const c of sorted) {
      const initials = (c.name||'?').charAt(0);
      const debtPct = totalDebt > 0 ? Math.round(((c.debt||0)/totalDebt)*100) : 0;
      html += `<div class="debt-row">
        <div class="debt-avatar">${esc(initials)}</div>
        <div class="debt-info">
          <div class="debt-name">${esc(c.name)}</div>
          <div class="debt-phone">${c.phone ? '📞 '+esc(c.phone) : '—'} · ${debtPct}% من الإجمالي</div>
        </div>
        <div class="debt-amount">
          <div class="amt">${fmt(c.debt)} ${C}</div>
          <div class="lbl">${c.lastPayment ? 'آخر دفع: '+esc(c.lastPayment) : 'لم يدفع'}</div>
        </div>
      </div>`;
    }
    html += `</div>`;
    document.getElementById('debts-list').innerHTML = html;
  }

  // ── start ─────────────────────────────────────────────────────────────────
  loadAll();
  // تحديث كل دقيقة — إذا كان POS متصل
  setInterval(() => { if (!_retryTimer) loadAll(); }, 60000);
})();
</script>
</body>
</html>
