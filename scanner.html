<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>سكانر الباركود</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap');

:root {
  --accent:       #2B5CE6;
  --accent-2:     #1a3a8f;
  --accent-light: #EEF2FF;
  --accent-hover: #2250d0;
  --bg:           #F2F5FC;
  --surface:      #ffffff;
  --border:       #DDE3F3;
  --border-2:     #EEF2FF;
  --text:         #1A1D2E;
  --text-2:       #6B7280;
  --text-3:       #9CA3AF;
  --danger:       #EF4444;
  --danger-light: #FEE2E2;
  --success:      #10B981;
  --success-light:#DCFCE7;
  --warn:         #F59E0B;
  --warn-light:   #FEF3C7;
  --shadow-sm:    0 1px 3px rgba(43,92,230,0.07);
  --shadow-md:    0 4px 16px rgba(43,92,230,0.10);
  --radius-sm:    8px;
  --radius-md:    12px;
  --cashier-grad: linear-gradient(145deg, #1a3a8f 0%, #2B5CE6 60%, #3b7af8 100%);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Tajawal', 'Segoe UI', Tahoma, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  font-size: 14px;
}

/* ── Header ── */
.header {
  background: var(--cashier-grad);
  color: #fff; padding: 0 16px; height: 54px;
  display: flex; align-items: center; justify-content: space-between;
  box-shadow: 0 2px 10px rgba(26,35,126,0.3);
  position: sticky; top: 0; z-index: 100;
}
.header-brand { display: flex; align-items: center; gap: 9px; font-size: 16px; font-weight: 800; }
.header-brand .logo {
  width: 32px; height: 32px; border-radius: var(--radius-sm);
  background: rgba(255,255,255,.2); display: flex; align-items: center; justify-content: center;
  font-size: 17px;
}
.dash-link {
  font-size: 12px; font-weight: 700; color: #fff;
  background: rgba(255,255,255,.15); border: 1px solid rgba(255,255,255,.3);
  padding: 6px 12px; border-radius: var(--radius-sm); text-decoration: none;
  transition: background .2s;
}
.dash-link:hover { background: rgba(255,255,255,.25); }

/* ── Content ── */
.content { padding: 14px; max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }

/* ── Connection card ── */
.conn-card {
  background: var(--surface); border-radius: var(--radius-md);
  border: 1px solid var(--border); box-shadow: var(--shadow-sm);
  padding: 10px 14px;
  display: flex; align-items: center; gap: 8px;
  font-size: 13px; font-weight: 700;
  transition: all .3s;
}
.conn-card.connecting { border-color: #fde68a; background: #fffbeb; color: var(--warn); }
.conn-card.connected  { border-color: #a7f3d0; background: var(--success-light); color: var(--success); }
.conn-card.error      { border-color: #fecaca; background: var(--danger-light); color: var(--danger); }
.c-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
.connecting .c-dot { background: var(--warn); animation: blink 1s infinite; }
.connected  .c-dot { background: var(--success); }
.error      .c-dot { background: var(--danger); animation: blink 1s infinite; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.25} }

/* ── Camera card ── */
.camera-card {
  background: var(--surface); border-radius: var(--radius-md);
  border: 1px solid var(--border); box-shadow: var(--shadow-sm);
  overflow: hidden;
}
.cam-wrap {
  position: relative; aspect-ratio: 4/3; background: #0f1827; overflow: hidden;
}
#camVideo { width:100%; height:100%; object-fit:cover; display:block; }

/* إطار التوجيه */
.cam-frame { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; pointer-events:none; }
.cam-frame svg { width:65%; max-width:240px; opacity:.85; }
.scan-line {
  position:absolute; left:10%; right:10%; height:2px;
  background: linear-gradient(90deg, transparent, var(--accent), transparent);
  box-shadow: 0 0 8px var(--accent);
  animation: scanMove 2s ease-in-out infinite; display:none;
}
@keyframes scanMove { 0%{top:14%} 50%{top:83%} 100%{top:14%} }

.result-pill {
  position:absolute; bottom:10px; left:50%; transform:translateX(-50%);
  background: rgba(16,185,129,.93); color:#fff;
  padding:6px 20px; border-radius:20px; font-size:14px; font-weight:800;
  opacity:0; transition:opacity .2s; white-space:nowrap; pointer-events:none;
  box-shadow: 0 2px 10px rgba(0,0,0,.2);
}
.result-pill.show { opacity:1; }
.lib-tag {
  position:absolute; top:8px; left:8px;
  background: rgba(43,92,230,.75); color:#fff;
  font-size:10px; padding:2px 7px; border-radius:5px; font-weight:700;
}

/* ── Camera actions ── */
.cam-actions { display:flex; gap:8px; padding:12px; }
.btn {
  flex:1; padding:11px; border-radius: var(--radius-sm); border:none;
  font-size:14px; font-weight:800; cursor:pointer; font-family:inherit;
  transition: all .15s;
}
.btn:active { transform:scale(.96); opacity:.8; }
.btn:disabled { opacity:.35; cursor:default; }
.btn-start { background: var(--accent); color:#fff; }
.btn-start:hover:not(:disabled) { background: var(--accent-hover); }
.btn-stop  { background: var(--bg); color: var(--text-2); border: 1.5px solid var(--border); }
.btn-stop.active { background: var(--danger-light); color: var(--danger); border-color: #fca5a5; }
.btn-flip  { flex:0 0 44px; background: var(--bg); color: var(--text-2); border: 1.5px solid var(--border); font-size:17px; }

/* ── Error message ── */
.cam-error {
  background: var(--danger-light); border: 1.5px solid #fca5a5;
  border-radius: var(--radius-sm); padding: 10px 14px;
  font-size: 13px; color: var(--danger); font-weight: 600; display:none;
  line-height: 1.6; margin: 0 12px 12px;
}

/* ── Card base ── */
.info-card {
  background: var(--surface); border-radius: var(--radius-md);
  border: 1px solid var(--border); box-shadow: var(--shadow-sm);
  padding: 14px;
}
.card-label { font-size: 11px; color: var(--text-3); font-weight: 700; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 6px; }

/* ── Last scan ── */
.last-code { font-size: 22px; font-weight: 900; color: var(--accent); letter-spacing: 1px; word-break:break-all; }
.last-code.empty { color: var(--text-3); font-size: 13px; font-weight: 500; }

/* ── Manual input ── */
.manual-wrap { display:flex; gap:8px; }
.manual-input {
  flex:1; background: var(--bg); border: 1.5px solid var(--border);
  border-radius: var(--radius-sm); padding: 10px 13px; color: var(--text);
  font-size: 15px; outline:none; direction:ltr; font-family:inherit;
  transition: border-color .18s, box-shadow .18s;
}
.manual-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(43,92,230,.1); }
.btn-send {
  background: var(--success); color:#fff; border:none;
  border-radius: var(--radius-sm); padding: 10px 16px;
  font-size: 14px; font-weight: 800; cursor:pointer; font-family:inherit;
  transition: background .15s;
}
.btn-send:hover { background: #059669; }

/* ── History ── */
.hist-item {
  display:flex; align-items:center; justify-content:space-between;
  padding: 8px 10px; border-radius: var(--radius-sm);
  font-size:13px; border-bottom: 1px solid var(--border-2);
}
.hist-item:last-child { border-bottom: none; }
.hi-code { font-weight: 800; color: var(--text); }
.hi-time { font-size: 11px; color: var(--text-3); }
.hi-ok   { font-size: 14px; color: var(--success); }

/* ── Flash ── */
.flash { position:fixed; inset:0; background:rgba(43,92,230,.12); pointer-events:none; opacity:0; transition:opacity .1s; }
.flash.on { opacity:1; }
</style>
</head>
<body>

<div class="header">
  <div class="header-brand">
    <div class="logo">📷</div>
    سكانر الباركود
  </div>
  <a class="dash-link" id="dashLink" href="#">📊 لوحة المتابعة</a>
</div>

<div class="content">

  <div class="conn-card connecting" id="connCard">
    <div class="c-dot"></div>
    <span id="connTxt">جاري الاتصال بالـ POS...</span>
  </div>

  <div class="camera-card">
    <div class="cam-wrap">
      <video id="camVideo" autoplay playsinline muted></video>
      <div class="scan-line" id="scanLine"></div>
      <div class="cam-frame">
        <svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M20 50 L20 20 L50 20"   stroke="#2B5CE6" stroke-width="3.5" stroke-linecap="round"/>
          <path d="M150 20 L180 20 L180 50" stroke="#2B5CE6" stroke-width="3.5" stroke-linecap="round"/>
          <path d="M20 150 L20 180 L50 180" stroke="#2B5CE6" stroke-width="3.5" stroke-linecap="round"/>
          <path d="M180 150 L180 180 L150 180" stroke="#2B5CE6" stroke-width="3.5" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="result-pill" id="resultPill"></div>
      <div class="lib-tag" id="libTag"></div>
    </div>

    <div class="cam-actions">
      <button class="btn btn-start" id="btnStart" onclick="startCamera()">▶ تشغيل الكاميرا</button>
      <button class="btn btn-stop"  id="btnStop"  onclick="stopCamera()" disabled>⏹ إيقاف</button>
      <button class="btn btn-flip"  id="btnFlip"  onclick="flipCamera()" disabled>🔄</button>
    </div>
    <div class="cam-error" id="camError"></div>
  </div>

  <div class="info-card">
    <div class="manual-wrap">
      <input class="manual-input" id="manualInput" type="text"
             placeholder="أدخل الباركود يدوياً..." inputmode="numeric"
             onkeydown="if(event.key==='Enter')sendManual()">
      <button class="btn-send" onclick="sendManual()">إرسال</button>
    </div>
  </div>

  <div class="info-card">
    <div class="card-label">آخر باركود ممسوح</div>
    <div class="last-code empty" id="lastCode">— لا يوجد بعد —</div>
  </div>

  <div class="info-card">
    <div class="card-label">آخر الباركودات</div>
    <div id="histList"><div style="color:var(--text-3);font-size:13px;padding:4px 0">لا يوجد بعد...</div></div>
  </div>

</div>

<div class="flash" id="flash"></div>

<script>
(() => {
  'use strict';
  const DEBOUNCE = 2000;
  const roomId   = location.pathname.split('/').pop();
  const WS_URL   = (location.protocol === 'https:' ? 'wss://' : 'ws://') +
                   location.host + '?role=phone&room=' + roomId;

  document.getElementById('dashLink').href = '/dashboard/' + roomId;

  // ── WebSocket ──
  let ws, wsRetry;
  function connectWS() {
    clearTimeout(wsRetry);
    ws = new WebSocket(WS_URL);
    ws.onopen  = () => setConn('connected', '✅ متصل بالـ POS');
    ws.onclose = () => { setConn('error', '❌ انقطع — إعادة المحاولة...'); wsRetry = setTimeout(connectWS, 3000); };
    ws.onerror = () => ws.close();
  }
  connectWS();

  function setConn(s, t) {
    const el = document.getElementById('connCard');
    el.className = 'conn-card ' + s;
    el.innerHTML = `<div class="c-dot"></div><span>${t}</span>`;
  }

  function sendBarcode(val) {
    if (!val) return;
    if (ws?.readyState === 1) ws.send(val);
    flashScreen(); beep();
    if (navigator.vibrate) navigator.vibrate([60]);
    const pill = document.getElementById('resultPill');
    pill.textContent = '✓ ' + val;
    pill.classList.add('show');
    setTimeout(() => pill.classList.remove('show'), 1800);
    document.getElementById('lastCode').textContent = val;
    document.getElementById('lastCode').classList.remove('empty');
    addHistory(val);
  }

  // ── كاميرا ──
  let _stream=null, _raf=null, _bd=null, _zxing=null;
  let facingMode='environment', scanning=false;
  let lastCode='', lastTime=0;
  const video = document.getElementById('camVideo');

  async function startCamera() {
    document.getElementById('camError').style.display = 'none';
    await stopScanner();
    if (!navigator.mediaDevices?.getUserMedia) {
      showErr('🔒 الكاميرا تحتاج HTTPS');
      return;
    }
    try {
      _stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: facingMode }, width:{ideal:1920}, height:{ideal:1080} }
      });
      video.srcObject = _stream;
      await video.play();
      scanning = true;
      setBtns(true);
      document.getElementById('scanLine').style.display = 'block';

      if (window.BarcodeDetector) {
        try {
          const supported = await BarcodeDetector.getSupportedFormats();
          _bd = new BarcodeDetector({ formats: supported.length ? supported : ['ean_13','ean_8','code_128','code_39','qr_code','upc_a','upc_e'] });
          document.getElementById('libTag').textContent = 'Native';
          runBD();
        } catch(e) { startZXing(); }
      } else {
        startZXing();
      }
    } catch(e) {
      let msg = '⚠️ تعذّر فتح الكاميرا';
      if (e.name === 'NotAllowedError') msg = '🚫 لم يُمنح إذن الكاميرا — اضغط على 🔒 وأعط الإذن';
      else if (e.name === 'NotFoundError') msg = '📵 لا توجد كاميرا';
      else if (e.name === 'NotReadableError') msg = '⚙️ الكاميرا مستخدمة من تطبيق آخر';
      showErr(msg);
    }
  }

  function runBD() {
    async function tick() {
      if (!scanning) return;
      if (video.readyState >= 2) {
        try {
          const barcodes = await _bd.detect(video);
          if (barcodes.length) onFound(barcodes[0].rawValue);
        } catch(e) {}
      }
      _raf = requestAnimationFrame(tick);
    }
    _raf = requestAnimationFrame(tick);
  }

  function startZXing() {
    document.getElementById('libTag').textContent = 'ZXing';
    const s = document.createElement('script');
    s.src = 'https://unpkg.com/@zxing/library@0.19.1/umd/index.min.js';
    s.onload = () => {
      const hints = new Map();
      hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [
        ZXing.BarcodeFormat.EAN_13, ZXing.BarcodeFormat.EAN_8,
        ZXing.BarcodeFormat.CODE_128, ZXing.BarcodeFormat.CODE_39,
        ZXing.BarcodeFormat.QR_CODE, ZXing.BarcodeFormat.UPC_A,
        ZXing.BarcodeFormat.UPC_E, ZXing.BarcodeFormat.ITF,
        ZXing.BarcodeFormat.DATA_MATRIX
      ]);
      hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
      _zxing = new ZXing.BrowserMultiFormatReader(hints, 400);
      _zxing.decodeFromVideoElement(video, (result) => { if (result) onFound(result.getText()); });
    };
    s.onerror = () => showErr('⚠️ تعذّر تحميل مكتبة المسح');
    document.head.appendChild(s);
  }

  function onFound(code) {
    code = String(code).trim();
    if (!code) return;
    const now = Date.now();
    if (code === lastCode && now - lastTime < DEBOUNCE) return;
    lastCode = code; lastTime = now;
    sendBarcode(code);
  }

  async function stopScanner() {
    scanning = false;
    if (_raf)   { cancelAnimationFrame(_raf); _raf=null; }
    if (_zxing) { try { _zxing.reset(); } catch(e){} _zxing=null; }
    if (_stream){ _stream.getTracks().forEach(t=>t.stop()); _stream=null; }
    video.srcObject = null;
    setBtns(false);
    document.getElementById('scanLine').style.display = 'none';
    document.getElementById('libTag').textContent = '';
  }

  function stopCamera() { stopScanner(); document.getElementById('btnStop').classList.remove('active'); }
  async function flipCamera() {
    facingMode = facingMode === 'environment' ? 'user' : 'environment';
    if (scanning) { await stopScanner(); setTimeout(startCamera, 200); }
  }
  function setBtns(on) {
    document.getElementById('btnStart').disabled = on;
    document.getElementById('btnStop').disabled  = !on;
    document.getElementById('btnStop').className = 'btn btn-stop' + (on ? ' active' : '');
    document.getElementById('btnFlip').disabled  = !on;
  }
  function showErr(msg) {
    const el = document.getElementById('camError');
    el.textContent = msg; el.style.display='block';
    setBtns(false);
  }

  function sendManual() {
    const inp = document.getElementById('manualInput');
    const v = inp.value.trim();
    if (v) { onFound(v); inp.value=''; }
  }

  const history = [];
  function addHistory(code) {
    const t = new Date();
    const time = [t.getHours(),t.getMinutes(),t.getSeconds()].map(n=>String(n).padStart(2,'0')).join(':');
    history.unshift({code,time});
    if (history.length > 8) history.pop();
    document.getElementById('histList').innerHTML = history.map(h =>
      `<div class="hist-item">
        <span class="hi-code">${h.code}</span>
        <span class="hi-time">${h.time}</span>
        <span class="hi-ok">✓</span>
      </div>`
    ).join('');
  }

  function flashScreen() {
    const el = document.getElementById('flash');
    el.classList.add('on');
    setTimeout(()=>el.classList.remove('on'), 120);
  }
  function beep() {
    try {
      const ctx = new (window.AudioContext||window.webkitAudioContext)();
      const o=ctx.createOscillator(), g=ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.frequency.value=1300; g.gain.setValueAtTime(.3,ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.12);
      o.start(ctx.currentTime); o.stop(ctx.currentTime+.12);
    } catch(e){}
  }

  window.startCamera=startCamera; window.stopCamera=stopCamera; window.flipCamera=flipCamera; window.sendManual=sendManual;
})();
</script>
</body>
</html>
