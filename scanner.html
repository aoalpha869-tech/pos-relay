<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>سكانر الباركود</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0f172a; color: #f1f5f9; font-family: 'Segoe UI', Tahoma, sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 16px; }
  h2 { margin: 16px 0 8px; font-size: 20px; }
  #status { font-size: 13px; padding: 6px 14px; border-radius: 20px; margin-bottom: 16px; }
  .connected    { background: #166534; color: #bbf7d0; }
  .disconnected { background: #7f1d1d; color: #fecaca; }
  .connecting   { background: #78350f; color: #fde68a; }
  #viewfinder {
    width: 100%; max-width: 420px; aspect-ratio: 1;
    background: #000; border-radius: 12px; overflow: hidden;
    position: relative; margin-bottom: 16px;
  }
  video { width: 100%; height: 100%; object-fit: cover; }
  .corners { position: absolute; inset: 0; pointer-events: none; }
  .corner {
    position: absolute; width: 32px; height: 32px;
    border-color: #22c55e; border-style: solid; border-width: 0;
  }
  .corner.tl { top: 12px; right: 12px; border-top-width: 3px; border-right-width: 3px; border-radius: 0 6px 0 0; }
  .corner.tr { top: 12px; left: 12px;  border-top-width: 3px; border-left-width: 3px;  border-radius: 6px 0 0 0; }
  .corner.bl { bottom: 12px; right: 12px; border-bottom-width: 3px; border-right-width: 3px; border-radius: 0 0 0 6px; }
  .corner.br { bottom: 12px; left: 12px;  border-bottom-width: 3px; border-left-width: 3px;  border-radius: 0 0 6px 0; }
  .scan-line {
    position: absolute; left: 12px; right: 12px; height: 2px;
    background: linear-gradient(90deg, transparent, #22c55e, transparent);
    animation: scan 2s linear infinite;
  }
  @keyframes scan { 0% { top: 12px; } 100% { top: calc(100% - 12px); } }
  #result { background: #1e293b; border-radius: 10px; padding: 12px 16px; width: 100%; max-width: 420px; margin-bottom: 12px; min-height: 44px; font-size: 15px; text-align: center; color: #94a3b8; }
  #result.ok { color: #22c55e; font-weight: 700; }
  .row { display: flex; gap: 10px; width: 100%; max-width: 420px; margin-bottom: 10px; }
  button {
    flex: 1; padding: 13px; border: none; border-radius: 10px;
    font-size: 15px; font-weight: 700; cursor: pointer; font-family: inherit;
  }
  #btnStart  { background: #2563eb; color: #fff; }
  #btnStop   { background: #374151; color: #9ca3af; }
  #btnStop.active { background: #dc2626; color: #fff; }
  #manualRow { display: flex; gap: 8px; width: 100%; max-width: 420px; }
  #manualInput { flex: 1; padding: 12px; border-radius: 10px; border: 1.5px solid #334155; background: #1e293b; color: #f1f5f9; font-size: 14px; text-align: right; }
  #btnSend { padding: 12px 20px; border-radius: 10px; background: #16a34a; color: #fff; border: none; font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit; }
</style>
</head>
<body>
<h2>📷 سكانر الباركود</h2>
<div id="status" class="connecting">⏳ جاري الاتصال...</div>

<div id="viewfinder">
  <video id="video" autoplay playsinline muted></video>
  <div class="corners">
    <div class="corner tl"></div><div class="corner tr"></div>
    <div class="corner bl"></div><div class="corner br"></div>
    <div class="scan-line" id="scanLine" style="display:none"></div>
  </div>
</div>

<div id="result">أوجّه الكاميرا نحو الباركود...</div>

<div class="row">
  <button id="btnStart" onclick="startCamera()">▶ تشغيل الكاميرا</button>
  <button id="btnStop"  onclick="stopCamera()">■ إيقاف</button>
</div>
<div id="manualRow">
  <input id="manualInput" type="text" placeholder="أدخل الباركود يدوياً..." inputmode="numeric">
  <button id="btnSend" onclick="sendManual()">إرسال</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<script>
  // ── Room ID من الـ URL ────────────────────────────────────────────────────
  const roomId = location.pathname.split('/').pop();
  const WS_URL = (location.protocol === 'https:' ? 'wss://' : 'ws://') +
                 location.host + '?role=phone&room=' + roomId;

  // ── WebSocket ─────────────────────────────────────────────────────────────
  let ws, wsRetry;
  const statusEl = document.getElementById('status');

  function connectWS() {
    clearTimeout(wsRetry);
    ws = new WebSocket(WS_URL);
    ws.onopen  = () => { statusEl.textContent = '✅ متصل'; statusEl.className = 'connected'; };
    ws.onclose = () => {
      statusEl.textContent = '❌ انقطع — إعادة المحاولة...';
      statusEl.className = 'disconnected';
      wsRetry = setTimeout(connectWS, 3000);
    };
    ws.onerror = () => ws.close();
  }
  connectWS();

  function sendBarcode(val) {
    if (!val || !ws || ws.readyState !== 1) return;
    ws.send(val);
    const r = document.getElementById('result');
    r.textContent = '✅ أُرسل: ' + val;
    r.className = 'ok';
    // صوت beep
    try {
      const ctx = new AudioContext();
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.frequency.value = 1200; g.gain.value = 0.3;
      o.start(); o.stop(ctx.currentTime + 0.1);
    } catch(e) {}
    setTimeout(() => { r.textContent = 'أوجّه الكاميرا نحو الباركود...'; r.className = ''; }, 2000);
  }

  // ── الكاميرا + jsQR ───────────────────────────────────────────────────────
  let stream, scanning = false, lastCode = '', lastTime = 0;
  const video = document.getElementById('video');
  const canvas = document.createElement('canvas');
  const ctx2 = canvas.getContext('2d');

  async function startCamera() {
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
      video.srcObject = stream;
      scanning = true;
      document.getElementById('scanLine').style.display = 'block';
      document.getElementById('btnStop').className = 'active';
      requestAnimationFrame(scanFrame);
    } catch(e) {
      document.getElementById('result').textContent = '⚠️ لا يمكن الوصول للكاميرا: ' + e.message;
    }
  }

  function stopCamera() {
    scanning = false;
    if (stream) stream.getTracks().forEach(t => t.stop());
    video.srcObject = null;
    document.getElementById('scanLine').style.display = 'none';
    document.getElementById('btnStop').className = '';
  }

  function scanFrame() {
    if (!scanning) return;
    if (video.readyState === video.HAVE_ENOUGH_DATA) {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      ctx2.drawImage(video, 0, 0);
      const img = ctx2.getImageData(0, 0, canvas.width, canvas.height);
      const qr  = jsQR(img.data, img.width, img.height, { inversionAttempts: 'dontInvert' });
      if (qr) {
        const now = Date.now();
        if (qr.data !== lastCode || now - lastTime > 2000) {
          lastCode = qr.data; lastTime = now;
          sendBarcode(qr.data);
        }
      }
    }
    requestAnimationFrame(scanFrame);
  }

  function sendManual() {
    const v = document.getElementById('manualInput').value.trim();
    if (v) { sendBarcode(v); document.getElementById('manualInput').value = ''; }
  }
  document.getElementById('manualInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') sendManual();
  });
</script>
</body>
</html>
